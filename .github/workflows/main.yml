name: Build Study AI V10.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "StudyAI_V10_1_*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract V10.1 project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "StudyAI_V10_1_TOKEN_JSON_FIXED.zip" -d extracted

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Build universal APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload Study AI APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Universal-V10.1
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

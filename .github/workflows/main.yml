name: Build Study AI V10.3.2 Release

on:
  workflow_dispatch:

  push:
    paths:
      - "StudyAI_V10_3_2_FINAL_REVIEW.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Java 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Gradle
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # =========================
      # Find ZIP
      # =========================
      - name: Find StudyAI ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -name "StudyAI_V10_3_2_FINAL_REVIEW.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: StudyAI V10.3.2 ZIP not found."
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # =========================
      # Extract
      # =========================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "${{ steps.project.outputs.zip }}" \
            -d extracted

      # =========================
      # Find Android project
      # =========================
      - name: Find Android project
        id: android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 7 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # =========================
      # Prepare Gradle
      # =========================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.android.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # =========================
      # Create signing keystore
      # =========================
      - name: Create signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/studyai"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/studyai/studyai-release.jks"

          if [ ! -s "$RUNNER_TEMP/studyai/studyai-release.jks" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore ready."

      # =========================
      # Clean
      # =========================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "${{ steps.android.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # =========================
      # Build Release
      # =========================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.android.outputs.dir }}"

          echo "======================================"
          echo " Study AI V10.3.2"
          echo " Release Build"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace
          else
            gradle assembleRelease \
              --no-daemon \
              --stacktrace
          fi

      # =========================
      # Find APK
      # =========================
      - name: Find Release APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find \
            "${{ steps.android.outputs.dir }}" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find \
              "${{ steps.android.outputs.dir }}" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # =========================
      # Android Build Tools
      # =========================
      - name: Locate Android tools
        id: tools
        shell: bash
        run: |
          set -e

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "zipalign" \
            | sort -V \
            | tail -1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -1)

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      # =========================
      # Align APK
      # =========================
      - name: Align APK
        id: aligned
        shell: bash
        run: |
          set -e

          INPUT="${{ steps.apk.outputs.path }}"
          OUTPUT="$RUNNER_TEMP/studyai/StudyAI-V10.3.2-aligned.apk"

          "${{ steps.tools.outputs.zipalign }}" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$OUTPUT"

          test -s "$OUTPUT"

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      # =========================
      # Sign APK
      # =========================
      - name: Sign Release APK
        id: signed
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          INPUT="${{ steps.aligned.outputs.path }}"
          OUTPUT="$RUNNER_TEMP/studyai/StudyAI-Universal-V10.3.2.apk"

          "${{ steps.tools.outputs.apksigner }}" sign \
            --ks "$RUNNER_TEMP/studyai/studyai-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$OUTPUT" \
            "$INPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      # =========================
      # Verify signature
      # =========================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "${{ steps.tools.outputs.apksigner }}" verify \
            --verbose \
            "${{ steps.signed.outputs.path }}"

          echo "======================================"
          echo " SIGNATURE VERIFIED"
          echo "======================================"

      # =========================
      # Final information
      # =========================
      - name: Final APK information
        shell: bash
        run: |
          set -e

          APK="${{ steps.signed.outputs.path }}"

          echo "======================================"
          echo " Study AI V10.3.2"
          echo " Universal Release APK"
          echo "======================================"

          ls -lh "$APK"

      # =========================
      # Upload Artifact
      # =========================
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Universal-V10.3.2
          path: ${{ steps.signed.outputs.path }}
          if-no-files-found: error
          retention-days: 30

name: Build Study AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract V4 project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "StudyAI_Custom_Haitham_V4_AI_Connected.zip" -d extracted
      - name: Find Backend files
        run: |
            echo "=== BACKEND FILES ==="
            find extracted -type f | grep -E '/(main.py|requirements.txt)$' || true    
      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Build Public APK
        run: |
          cd "$ANDROID_DIR"
          gradle assemblePublicEditionDebug --stacktrace

      - name: Build Developer APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDeveloperEditionDebug --stacktrace

      - name: Upload Public APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Public
          path: "**/build/outputs/apk/publicEdition/debug/*.apk"

      - name: Upload Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Developer
          path: "**/build/outputs/apk/developerEdition/debug/*.apk"

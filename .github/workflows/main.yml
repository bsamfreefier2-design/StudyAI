name: Build Study AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q StudyAI_Custom_Haitham_V3.zip -d extracted
          echo "Files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f -name settings.gradle | head -1 | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV
          echo "Android project: $ANDROID_DIR"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-APK
          path: "**/build/outputs/apk/debug/*.apk"

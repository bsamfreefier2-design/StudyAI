name: Build Study AI V10.3.1

on:
  workflow_dispatch:

  push:
    paths:
      - "StudyAI_V10_3_1_LAYOUT_DEVICEID_FIXED.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Download project
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================
      # 2. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # 3. Gradle
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ==============================
      # 4. Find ZIP
      # ==============================
      - name: Find StudyAI ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -name "StudyAI_V10_3_1_LAYOUT_DEVICEID_FIXED.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP"

          echo "path=$ZIP" >> "$GITHUB_OUTPUT"


      # ==============================
      # 5. Extract
      # ==============================
      - name: Extract StudyAI
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "${{ steps.zip.outputs.path }}" \
            -d extracted


      # ==============================
      # 6. Find Android project
      # ==============================
      - name: Find Android project
        id: android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."

            find extracted -maxdepth 6 -type f | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==============================
      # 7. Prepare Gradle
      # ==============================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.android.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi


      # ==============================
      # 8. Create signing keystore
      # ==============================
      - name: Create signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/studyai"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/studyai/studyai-release.jks"

          if [ ! -s "$RUNNER_TEMP/studyai/studyai-release.jks" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore created."


      # ==============================
      # 9. Clean
      # ==============================
      - name: Clean
        shell: bash
        run: |
          set -e

          cd "${{ steps.android.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi


      # ==============================
      # 10. Build Release
      # ==============================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.android.outputs.dir }}"

          echo "Building Study AI V10.3.1 Release..."

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace
          else
            gradle assembleRelease \
              --no-daemon \
              --stacktrace
          fi


      # ==============================
      # 11. Find APK
      # ==============================
      - name: Find Release APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find \
            "${{ steps.android.outputs.dir }}" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find \
              "${{ steps.android.outputs.dir }}" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"


      # ==============================
      # 12. Android Build Tools
      # ==============================
      - name: Locate Android tools
        id: tools
        shell: bash
        run: |
          set -e

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "zipalign" \
            | sort -V \
            | tail -1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -1)

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"


      # ==============================
      # 13. Align APK
      # ==============================
      - name: Align APK
        id: aligned
        shell: bash
        run: |
          set -e

          INPUT="${{ steps.apk.outputs.path }}"
          OUTPUT="$RUNNER_TEMP/studyai/StudyAI-V10.3.1-aligned.apk"

          "${{ steps.tools.outputs.zipalign }}" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$OUTPUT"

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"


      # ==============================
      # 14. Sign APK
      # ==============================
      - name: Sign APK
        id: signed
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          INPUT="${{ steps.aligned.outputs.path }}"
          OUTPUT="$RUNNER_TEMP/studyai/StudyAI-Universal-V10.3.1.apk"

          "${{ steps.tools.outputs.apksigner }}" sign \
            --ks "$RUNNER_TEMP/studyai/studyai-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$OUTPUT" \
            "$INPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo "APK signed successfully."


      # ==============================
      # 15. Verify signature
      # ==============================
      - name: Verify signature
        shell: bash
        run: |
          set -e

          "${{ steps.tools.outputs.apksigner }}" verify \
            --verbose \
            "${{ steps.signed.outputs.path }}"

          echo "Signature verified successfully."


      # ==============================
      # 16. Show APK
      # ==============================
      - name: APK information
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Study AI V10.3.1"
          echo "Universal Release APK"
          echo "=============================="

          ls -lh "${{ steps.signed.outputs.path }}"


      # ==============================
      # 17. Upload final APK
      # ==============================
      - name: Upload Study AI V10.3.1
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Universal-V10.3.1
          path: ${{ steps.signed.outputs.path }}
          if-no-files-found: error
          retention-days: 30

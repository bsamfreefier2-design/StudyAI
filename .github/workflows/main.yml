name: Build Study AI V10.3.2 Release

on:
  workflow_dispatch:
  push:
    paths:
      - "StudyAI_V10_3_2_FINAL_FIXED.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find FINAL FIXED project
        id: project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -name "StudyAI_V10_3_2_FINAL_FIXED.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: StudyAI_V10_3_2_FINAL_FIXED.zip not found."
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.project.outputs.zip }}" -d extracted

      - name: Find Android project
        id: android
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 7 -type f | head -300
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e
          cd "${{ steps.android.outputs.dir }}"
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Create signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/studyai"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studyai/studyai-release.jks"
          test -s "$RUNNER_TEMP/studyai/studyai-release.jks"

      - name: Clean
        shell: bash
        run: |
          set -e
          cd "${{ steps.android.outputs.dir }}"
          if [ -f gradlew ]; then
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      - name: Build release
        shell: bash
        run: |
          set -e
          cd "${{ steps.android.outputs.dir }}"
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Find release APK
        id: apk
        shell: bash
        run: |
          set -e
          APK=$(find "${{ steps.android.outputs.dir }}" -type f -path "*/build/outputs/apk/release/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find "${{ steps.android.outputs.dir }}" -type f | head -300
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Locate Android signing tools
        id: tools
        shell: bash
        run: |
          set -e
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"
          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Zipalign
        id: aligned
        shell: bash
        run: |
          set -e
          OUT="$RUNNER_TEMP/studyai/aligned.apk"
          "${{ steps.tools.outputs.zipalign }}" -f -p 4 "${{ steps.apk.outputs.path }}" "$OUT"
          test -s "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Sign release APK
        id: signed
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -e
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          OUT="$RUNNER_TEMP/studyai/StudyAI-Universal-V10.3.2.apk"
          "${{ steps.tools.outputs.apksigner }}" sign \
            --ks "$RUNNER_TEMP/studyai/studyai-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$OUT" \
            "${{ steps.aligned.outputs.path }}"
          test -s "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e
          "${{ steps.tools.outputs.apksigner }}" verify --verbose "${{ steps.signed.outputs.path }}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Universal-V10.3.2
          path: ${{ steps.signed.outputs.path }}
          if-no-files-found: error
          retention-days: 30

name: Build Study AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract V6 UI FIXED project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "StudyAI_Custom_Haitham_V6_UI_FIXED.zip" -d extracted

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Check Android project
        run: |
          cd "$ANDROID_DIR"
          echo "Project directory:"
          pwd
          echo "Gradle files:"
          ls -la

      - name: Build Public APK
        run: |
          cd "$ANDROID_DIR"
          gradle assemblePublicEditionDebug --stacktrace

      - name: Build Developer APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDeveloperEditionDebug --stacktrace

      - name: Upload Public APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Public
          path: "**/build/outputs/apk/publicEdition/debug/*.apk"
          if-no-files-found: error

      - name: Upload Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Developer
          path: "**/build/outputs/apk/developerEdition/debug/*.apk"
          if-no-files-found: error

name: Build Study AI V10.3.1 Release

on:
  workflow_dispatch:

  push:
    paths:
      - "StudyAI_V10_3_1_LAYOUT_FIXED.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find V10.3.1 ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -name "StudyAI_V10_3_1_LAYOUT_FIXED.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V10.3.1 ZIP not found."
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "${{ steps.find_zip.outputs.zip }}" \
            -d extracted

      - name: Find Android project
        id: android_project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 6 -type f | head -300
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")

          echo "Android project: $ANDROID_DIR"
          echo "dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.android_project.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Create signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/studyai"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/studyai/studyai-release.jks"

          test -s "$RUNNER_TEMP/studyai/studyai-release.jks"

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "${{ steps.android_project.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build Release
        shell: bash
        run: |
          set -e

          cd "${{ steps.android_project.outputs.dir }}"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace
          else
            gradle assembleRelease \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          set -e

          APK=$(find \
            "${{ steps.android_project.outputs.dir }}" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find \
              "${{ steps.android_project.outputs.dir }}" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Locate Android Build Tools
        id: build_tools
        shell: bash
        run: |
          set -e

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "zipalign" \
            | sort -V | tail -1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V | tail -1)

          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"

          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Align APK
        id: align
        shell: bash
        run: |
          set -e

          INPUT="${{ steps.find_apk.outputs.apk }}"
          OUTPUT="$RUNNER_TEMP/studyai/StudyAI-V10.3.1-aligned.apk"

          "${{ steps.build_tools.outputs.zipalign }}" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$OUTPUT"

          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        id: sign
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          INPUT="${{ steps.align.outputs.apk }}"
          OUTPUT="$RUNNER_TEMP/studyai/StudyAI-Universal-V10.3.1.apk"

          "${{ steps.build_tools.outputs.apksigner }}" sign \
            --ks "$RUNNER_TEMP/studyai/studyai-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$OUTPUT" \
            "$INPUT"

          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          "${{ steps.build_tools.outputs.apksigner }}" verify \
            --verbose \
            "${{ steps.sign.outputs.apk }}"

      - name: Show APK
        shell: bash
        run: |
          ls -lh "${{ steps.sign.outputs.apk }}"

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Universal-V10.3.1
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

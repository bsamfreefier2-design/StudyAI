name: Build Study AI V10.4.2 AI Stable

on:
  workflow_dispatch:
  push:
    paths:
      - "StudyAI_V10_4_2_AI_STABLE.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find AI Stable ZIP
        id: project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -name "StudyAI_V10_4_2_AI_STABLE.zip" -print -quit)
          test -n "$ZIP" || {
            echo "ERROR: StudyAI_V10_4_2_AI_STABLE.zip not found."
            exit 1
          }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.project.outputs.zip }}" -d extracted

      - name: Find Android project
        id: android
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          test -n "$SETTINGS" || {
            echo "ERROR: Android settings.gradle not found."
            exit 1
          }

          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        run: |
          cd "${{ steps.android.outputs.dir }}"
          test -f gradlew && chmod +x gradlew || true

      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          mkdir -p "$RUNNER_TEMP/studyai"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/studyai/studyai-release.jks"

          test -s "$RUNNER_TEMP/studyai/studyai-release.jks"

      - name: Clean
        run: |
          cd "${{ steps.android.outputs.dir }}"

          if [ -f gradlew ]; then
            ./gradlew clean --no-daemon --stacktrace
          else
            gradle clean --no-daemon --stacktrace
          fi

      - name: Build Release APK
        run: |
          cd "${{ steps.android.outputs.dir }}"

          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Find Release APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.android.outputs.dir }}" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          test -n "$APK" || {
            echo "ERROR: Release APK not found."
            exit 1
          }

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Locate signing tools
        id: tools
        shell: bash
        run: |
          set -e

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name zipalign \
            | sort -V | tail -1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V | tail -1)

          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"

          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      - name: Zipalign
        id: aligned
        run: |
          set -e

          OUT="$RUNNER_TEMP/studyai/aligned.apk"

          "${{ steps.tools.outputs.zipalign }}" \
            -f \
            -p 4 \
            "${{ steps.apk.outputs.path }}" \
            "$OUT"

          test -s "$OUT"

          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Sign Release APK
        id: signed
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          OUT="$RUNNER_TEMP/studyai/StudyAI-Universal-V10.4.2.apk"

          "${{ steps.tools.outputs.apksigner }}" sign \
            --ks "$RUNNER_TEMP/studyai/studyai-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$OUT" \
            "${{ steps.aligned.outputs.path }}"

          test -s "$OUT"

          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          "${{ steps.tools.outputs.apksigner }}" verify \
            --verbose \
            "${{ steps.signed.outputs.path }}"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Universal-V10.4.2
          path: ${{ steps.signed.outputs.path }}
          if-no-files-found: error
          retention-days: 30
